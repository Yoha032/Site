<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Баскетбол · АндрейСпросил</title>
<meta name="theme-color" content="#0A0A0A">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--card:#161616;--tx:#F5F5F5;--mut:#A3A3A3;--line:#2A2A2A;--acc:#B6FF1A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 0}
main{max-width:520px;margin:0 auto;padding:16px 16px 0}
html.tg header{display:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.logo{font:700 20px Unbounded,sans-serif;text-decoration:none;color:var(--tx)}
.logo b{color:var(--acc)}
.back{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;border:2px solid var(--line);color:var(--tx);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
h1{font:700 22px/1.2 Unbounded,sans-serif;margin:2px 0 12px}
.st{font:400 12px Manrope,sans-serif;color:var(--mut);margin-left:8px;white-space:nowrap}
.st.bad{color:#ff6b6b}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.lab{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut)}
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.win{display:flex;flex-direction:column;align-items:center}
.win b{font:700 28px/1.2 Unbounded,sans-serif;color:var(--acc)}
.win span{font-size:12px;display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #666;flex:none}
.team{border:2px solid var(--tc);background:var(--tf);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 0 14px var(--tg)}
.th{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px}
.th .nm{flex:1;font-weight:800}
.th .nm i{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--mut);margin-left:6px}
.th .sc{font:700 26px Unbounded,sans-serif}
.p{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-top:1px solid var(--line)}
.p .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.ed{background:rgba(182,255,26,.08)}
button{font:inherit;color:var(--tx);cursor:pointer}
.b{width:48px;height:40px;border-radius:10px;border:1px solid #3A3A3A;background:var(--bg);font-weight:800;font-size:15px;padding:0}
.b:active{transform:scale(.95)}
.b.m{border-color:#E5262B;color:#FF8A8A}
.s{width:44px;height:38px;text-align:right;font:700 20px Unbounded,sans-serif;background:none;border:2px solid transparent;border-radius:8px;padding:0 4px}
.s.z{color:#8A8A8A}
.ed .s{border-color:var(--acc);text-align:center}
.rest{display:flex;align-items:center;gap:8px;width:100%;height:52px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;text-align:left}
.rest .nm{flex:1;font-weight:800}
.rest .nm i{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--mut);margin-left:6px}
.rl{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:-6px 0 12px;padding:4px 12px}
.rl div{padding:8px 0;border-top:1px solid var(--line);color:var(--mut)}
.rl div:first-child{border:0}
.tm-w{--tc:#FFFFFF;--tf:rgba(255,255,255,.12);--tg:rgba(255,255,255,.35)}
.tm-b{--tc:#A7ADB4;--tf:#000;--tg:rgba(167,173,180,.3)}
.tm-r{--tc:#E5262B;--tf:rgba(229,38,43,.14);--tg:rgba(229,38,43,.4)}
details.card summary{cursor:pointer;font-weight:600}
.sub{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin:16px 0 6px;text-transform:uppercase}
select,textarea,input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wide{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:#0A0A0A;font-weight:800}
.ghost{width:100%;margin-top:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.hd{margin-bottom:8px}
.bar{position:sticky;bottom:0;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,10,10,0),var(--bg) 28%)}
#msg{min-height:0;text-align:center;color:var(--acc);font-size:14px;margin-bottom:6px}
#msg:empty{display:none}
#msg .sm{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#msg .sm button{padding:10px 14px;border-radius:10px;font-weight:800;border:1px solid}
#msg button[data-draw]{background:#E5262B;border-color:#E5262B;color:#fff}
#msg button[data-cancel]{background:#3DDC84;border-color:#3DDC84;color:#0A0A0A}
.bb{display:flex;gap:8px}
#undo{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:14px;border:1px solid #3A3A3A;background:var(--bg);font-weight:700;font-size:14px}
#finish{flex:1;height:48px;border-radius:14px;border:0;background:#E5262B;color:#fff;font-weight:800;font-size:15px}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.tab{display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-weight:700;font-size:14px;text-decoration:none}
.tab.on{background:var(--tx);color:#0A0A0A;border-color:var(--tx)}
.timer{display:flex;align-items:center;gap:10px}
.tcl{font:700 32px/1 Unbounded,sans-serif;min-width:118px}
.tcl.run{color:var(--acc)}
.tcl.low{color:#FFB020}
.tcl.over{color:#E5262B;animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.35}}
.timer .sp{flex:1;font-size:12px}
#tgo{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--acc);color:#0A0A0A;font-weight:800}
#trst{width:44px;height:44px;border-radius:12px;border:1px solid #3A3A3A;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
.who{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 4px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-size:16px}
.who:first-of-type{border-top:0}
.who .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--acc);background:var(--acc);color:#0A0A0A;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who.off .ck{background:none;border-color:#555}
.who.off .nm2{color:#777;text-decoration:line-through}
.who i{font-style:normal;font-size:11px;color:var(--acc);letter-spacing:.06em;margin-left:6px;text-transform:uppercase}
.who small{margin-left:auto;color:#FF8A8A;font-size:12px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.toprow a{font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;white-space:nowrap}
#dlg{position:fixed;inset:0;z-index:50}
#dlg[hidden]{display:none}
.dback{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.dbox{position:absolute;top:0;left:0;right:0;max-width:520px;margin:0 auto;background:#161616;border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;animation:dn .18s ease-out}
@keyframes dn{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.dt{font:700 18px Unbounded,sans-serif;text-align:center}
.dres{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 8px;text-align:center}
.dres .ds{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.dres .ds b{font:700 40px/1.1 Unbounded,sans-serif}
.dres .ds span{display:flex;align-items:center;gap:6px;font-size:14px}
.dres .vs{font:700 28px Unbounded,sans-serif;color:var(--mut)}
.dnote{text-align:center;color:var(--mut);font-size:14px;margin-bottom:14px}
.dnote.warn{color:#FFB020}
.dbtn{display:grid;gap:8px}
.dbtn button{height:50px;border-radius:14px;border:0;font-weight:800;font-size:15px}
#dok{background:#E5262B;color:#fff}
#dno{background:#3DDC84;color:#0A0A0A}
.pg{margin-bottom:12px}
.ph{font-weight:800;margin-bottom:4px}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg .mn{width:44px;color:var(--mut);font-weight:700;flex:none}
.lg span:nth-child(2){flex:1;min-width:0}
.lg small{color:var(--mut);width:40px;text-align:right}
.lg i{font-style:normal;color:#FF8A8A;font-size:12px;margin-left:4px}
.lg.fin{color:var(--acc)}
.lg.fin .mn{color:var(--acc)}
</style>
</head>
<body>
<main>
<header>
  <a class="logo" id="logo" href="index.html" aria-label="АндрейСпросил, на главную">Андрей<b>Спросил</b></a>
  <a class="back" id="back" href="media.html">← Назад</a>
</header>
<div class="mut" id="date"></div>
<h1>Баскетбол<span class="st" id="st"></span></h1>
<nav class="tabs" aria-label="Разделы">
  <button class="tab on" data-view="score" id="tScore">Счёт</button>
  <button class="tab" data-view="roster" id="tRoster">Состав</button>
  <a class="tab" id="statsLink" href="basketball-stats.html">Таблица</a>
</nav>

<section id="vScore">

<div class="card"><div class="lab">ПОБЕДЫ СЕГОДНЯ</div><div class="wins" id="wins"></div></div>
<div class="card timer" id="timer">
  <span class="tcl" id="tclock">07:00</span>
  <span class="sp mut" id="tlab">таймер игры</span>
  <button id="trst" aria-label="Сбросить таймер"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button id="tgo">Старт</button>
</div>
<div id="teams"></div>

<details class="card" id="more">
  <summary>Протокол, история, настройки</summary>
  <div class="sub">Играют сейчас</div>
  <div class="two" id="sel"></div>
  <div class="sub">Протокол сегодняшней встречи</div>
  <div id="proto"></div>
  <div class="sub">История игр</div>
  <div id="hist"></div>
  <button class="ghost" id="reset">Сбросить всё</button>
</details>

<div class="bar">
  <div id="msg" role="status"></div>
  <div class="bb">
    <button id="undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Отменить</button>
    <button id="finish">Завершить игру</button>
  </div>
</div>
</section>

<section id="vRoster" hidden>
  <div class="card"><div class="lab">КТО ПРИШЁЛ</div><div class="mut" id="rcount" style="margin-top:4px"></div></div>
  <div id="rlist"></div>
  <div class="card">
    <div class="lab">ДОБАВИТЬ ИГРОКА, КОТОРОГО НЕТ В СПИСКЕ</div>
    <div class="two" style="margin-top:8px"><input id="gname" placeholder="Имя" maxlength="30" autocomplete="off"><select id="gteam" aria-label="В какую команду"></select></div>
    <button class="wide" id="gadd">Добавить в команду</button>
    <div class="mut" id="gmsg" style="margin-top:6px" role="status"></div>
  </div>
  <details class="card">
    <summary>Загрузить составы из Telegram</summary>
  <textarea id="rt" rows="7" placeholder="Вставьте сюда сообщение с составами"></textarea>
  <button class="wide" id="rload">Загрузить составы</button>
  <div class="mut" id="rmsg" style="margin-top:6px"></div>
  </details>
</section>
</main>
<div id="dlg" hidden>
  <div class="dback" id="dback"></div>
  <div class="dbox" role="alertdialog" aria-modal="true" aria-labelledby="dtt">
    <div class="dt" id="dtt">Завершить игру?</div>
    <div class="dres" id="dres"></div>
    <div class="dnote" id="dnote"></div>
    <div class="dbtn"><button id="dok">Подтвердить: завершить игру</button><button id="dno">Продолжить игру</button></div>
  </div>
</div>
<script src="basketball-config.js"></script>
<script src="basketball-core.js"></script>
<script>
var TG=window.Telegram&&Telegram.WebApp;
if(TG&&TG.initData){
  document.documentElement.classList.add('tg');
  try{TG.ready();TG.expand();TG.setHeaderColor('#0A0A0A');TG.setBackgroundColor('#0A0A0A');if(TG.disableVerticalSwipes)TG.disableVerticalSwipes()}catch(e){}
}
try{if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param==='table'){location.replace('basketball-stats.html?app=1')}}catch(e){}
var EMB=(top!==self)||/[?&]app/.test(location.search);
document.getElementById('back').href=EMB?'media.html?app=1':'media.html';
document.getElementById('logo').href=EMB?'index.html?app=1':'index.html';
document.getElementById('statsLink').href=EMB?'basketball-stats.html?app=1':'basketball-stats.html';
var remote=[],pending=[],sent={},busy=false,S=null,last='',editP=null,openR={},pr=false,mt=null,view='score',beeped=-1,ac=null;
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function setSt(ok){var s=$('st');s.textContent=SYNC?(ok?'● онлайн':'● нет связи'):'● только это устройство';s.className='st'+(SYNC&&!ok?' bad':'')}
function toast(t){if(pr)return;$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(function(){if(!pr)$('msg').textContent=''},4000)}

function send(ev){
  ev.id=uid();ev.ts=Date.now();
  if(!SYNC){remote.push(ev);try{localStorage.setItem(LKEY,JSON.stringify(remote))}catch(e){}render();return}
  pending.push(ev);render();flush();
}
function flush(){
  if(busy)return;
  var e=pending.filter(function(x){return !sent[x.id]})[0];
  if(!e)return;
  busy=true;
  fetch(EURL,{method:'POST',body:JSON.stringify(e)})
   .then(function(r){if(!r.ok)throw 0;sent[e.id]=1;return refresh()})
   .then(function(){busy=false;flush()},function(){busy=false;setSt(false)});
}
function refresh(){
  return fetch(EURL).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
    remote=o?Object.keys(o).sort().map(function(k){return o[k]}):[];
    var ids={};remote.forEach(function(e){ids[e.id]=1});
    pending=pending.filter(function(e){return !ids[e.id]});
    setSt(true);render();
  });
}

function renderRoster(){
  var R=S.roster;
  if(!R){$('rlist').innerHTML='<div class="card empty">Составы ещё не загружены. Откройте «Загрузить составы из Telegram» ниже.</div>';$('rcount').textContent='';$('gteam').innerHTML='';return}
  var tot=0,here=0;
  $('rlist').innerHTML=['w','b','r'].map(function(k){
    var ps=R.teams[k].players,h=ps.filter(function(p){return !p.x}).length;tot+=ps.length;here+=h;
    return '<div class="card"><div class="lab" style="display:flex;align-items:center;gap:6px">'+dot(k)+esc(S.names[k])+' · на месте '+h+' из '+ps.length+'</div>'+
      ps.map(function(p){
        var nm=esc(p.n);
        return '<button class="who'+(p.x?' off':'')+'" data-abs="'+nm+'" data-on="'+(p.x?0:1)+'" aria-pressed="'+(!p.x)+'"><span class="ck">'+(p.x?'':'✓')+'</span><span class="nm2">'+nm+'</span>'+(p.g?'<i>гость</i>':'')+(p.x?'<small>не пришёл</small>':'')+'</button>';
      }).join('')+'</div>';
  }).join('');
  $('rcount').textContent='На встрече '+here+' из '+tot+'. Нажмите на имя, чтобы отметить, что игрок не пришёл.';
  var gt=$('gteam'),cv=gt.value;
  gt.innerHTML=['w','b','r'].map(function(k){return '<option value="'+k+'">'+esc(S.names[k])+'</option>'}).join('');
  if(cv)gt.value=cv;
}
function render(){
  S=build(remote.concat(pending));
  var key=JSON.stringify([S,editP,openR,view]);
  if(key===last)return;
  last=key;
  var c=S.cur,R=S.roster,third=['w','b','r'].filter(function(k){return k!==c.a&&k!==c.b})[0];
  $('wins').innerHTML=['w','b','r'].map(function(k){return '<div class="win"><b>'+S.td[k]+'</b><span>'+dot(k)+esc(S.names[k])+'</span></div>'}).join('');

  if(!R){
    $('teams').innerHTML='<div class="card empty">Составы ещё не загружены.<br>Откройте вкладку «Состав» и вставьте сообщение из канала.</div>';
  }else{
    function team(k){
      var t=R.teams[k],sc=teamScore(S,k);
      return '<div class="team tm-'+k+'"><div class="th">'+dot(k)+'<span class="nm">'+esc(S.names[k])+'<i>ИГРАЕТ</i></span><span class="sc">'+sc+'</span></div>'+
      t.players.filter(function(p){return !p.x}).map(function(p){
        var v=c.pts[p.n]||0,ed=editP===p.n,nm=esc(p.n);
        var bt=ed?[-2,-3]:[2,3];
        return '<div class="p'+(ed?' ed':'')+'"><span class="n">'+nm+'</span>'+
        bt.map(function(n){return '<button class="b'+(ed?' m':'')+'" data-pt="1" data-p="'+nm+'" data-n="'+n+'" aria-label="'+nm+' '+(n>0?'+':'−')+Math.abs(n)+'">'+(n>0?'+':'−')+Math.abs(n)+'</button>'}).join('')+
        '<button class="s'+(v?'':' z')+'" data-edit="'+nm+'" aria-label="'+nm+', очки '+v+', исправить">'+v+'</button></div>';
      }).join('')+'</div>';
    }
    var rt=R.teams[third],op=!!openR[third];
    $('teams').innerHTML=team(c.a)+team(c.b)+
      '<button class="rest" data-open="'+third+'" aria-expanded="'+op+'">'+dot(third)+'<span class="nm">'+esc(S.names[third])+'<i>ОТДЫХАЕТ</i></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate('+(op?180:0)+'deg)"><path d="m6 9 6 6 6-6"/></svg></button>'+
      (op?'<div class="rl">'+rt.players.filter(function(p){return !p.x}).map(function(p){return '<div>'+esc(p.n)+'</div>'}).join('')+'</div>':'');
  }

  function opts(sel){return ['w','b','r'].map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(S.names[k])+'</option>'}).join('')}
  $('sel').innerHTML='<select data-s="a" aria-label="Первая команда">'+opts(c.a)+'</select><select data-s="b" aria-label="Вторая команда">'+opts(c.b)+'</select>';

  $('vScore').hidden=view!=='score';$('vRoster').hidden=view!=='roster';
  $('tScore').className='tab'+(view==='score'?' on':'');$('tRoster').className='tab'+(view==='roster'?' on':'');
  renderRoster();
  $('proto').innerHTML=protoHtml(S,today());
  var by={},ab={};
  S.games.forEach(function(g){(by[g.d]=by[g.d]||[]).push(g)});
  S.adj.forEach(function(x){(ab[x.d]=ab[x.d]||[]).push(x)});
  var dm={};Object.keys(by).concat(Object.keys(ab)).forEach(function(d){dm[d]=1});
  var ds=Object.keys(dm).sort().reverse();
  $('hist').innerHTML=ds.length?ds.map(function(d){
    var cnt={w:0,b:0,r:0},tot={};
    (by[d]||[]).forEach(function(g){winners(g).forEach(function(k){cnt[k]++});for(var n in g.pts)tot[n]=(tot[n]||0)+g.pts[n]});
    (ab[d]||[]).forEach(function(x){cnt[x.k]+=x.n});
    var top=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]}).slice(0,3).map(function(n){return esc(n)+' '+tot[n]}).join(' · ');
    return '<div class="hd"><b>'+esc(fmt(d))+'</b><div class="mut">'+['w','b','r'].map(function(k){return esc(S.names[k])+' '+cnt[k]}).join(' · ')+'</div>'+
      (top?'<div class="mut">Больше всех очков: '+top+'</div>':'')+
      (by[d]||[]).slice().reverse().map(function(g){return '<div class="row"><span>'+dot(g.a)+esc(S.names[g.a])+' — '+dot(g.b)+esc(S.names[g.b])+(g.dr?' <span class="mut">· ничья</span>':'')+'</span><b>'+g.sa+':'+g.sb+'</b></div>'}).join('')+'</div>';
  }).join(''):'<div class="mut">Пока нет сыгранных игр</div>';
  tick();
}

/* ---- разбор сообщения с составами ---- */
function parse(txt){
  var teams={},cur=null,title='',M={'⚪':'w','⚫':'b','🔴':'r'};
  txt.split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l)return;
    var m;
    if(!cur&&/Составы/i.test(l)){title=l.replace(/^[^\p{L}]+/u,'');return}
    if((m=l.match(/^(.+?)\s*(⚪|⚫|🔴)\uFE0F?$/))){cur=M[m[2]];teams[cur]={name:m[1].trim(),stats:'',players:[]};return}
    if(!cur)return;
    if((m=l.match(/Ср\.\s*рейтинг:\s*([\d.]+).*?Ср\.\s*рост:\s*(\d+).*?Ср\.\s*вес:\s*(\d+)/i))){teams[cur].stats='рейтинг '+m[1]+' · '+m[2]+' см · '+m[3]+' кг';return}
    if((m=l.match(/^[-•–]\s*(.+?)\s*(@\w+)?\s*\((.+),\s*([\d.]+)\)\s*$/))){
      teams[cur].players.push({n:m[1].replace(/\s*NoNick$/i,'').trim(),u:m[2]?m[2].slice(1):'',role:m[3],r:m[4]});
    }
  });
  return Object.keys(teams).length===3?{title:title,teams:teams}:null;
}
function ask(text,cb){
  if(TG&&TG.initData&&TG.showConfirm){TG.showConfirm(text,cb)}else{cb(confirm(text))}
}
document.addEventListener('click',function(e){
  unlock();
  var t=e.target.closest('button[data-view]');
  if(t){view=t.dataset.view;window.scrollTo(0,0);render();return}
  t=e.target.closest('button[data-abs]');
  if(t){
    var nm=t.dataset.abs,on=t.dataset.on==='1';
    if(on&&(S.cur.pts[nm]||0)>0){$('gmsg').textContent='У игрока '+nm+' уже есть очки в этой игре. Сначала исправьте их на экране счёта.';return}
    $('gmsg').textContent='';send({t:'pabs',n:nm,on:on});return;
  }
  if(e.target.id==='gadd'){
    var gn=$('gname').value.replace(/\s+/g,' ').trim();
    if(!S.roster){$('gmsg').textContent='Сначала загрузите составы.';return}
    if(!gn){$('gmsg').textContent='Введите имя игрока.';return}
    send({t:'padd',tm:$('gteam').value,n:gn});$('gname').value='';$('gmsg').textContent='Добавлен: '+gn+'.';return;
  }
  t=e.target.closest('button[data-pt]');
  if(t){
    var p=t.dataset.p,n=Number(t.dataset.n),v=S.cur.pts[p]||0;
    if(pr){pr=false;$('msg').textContent=''}
    if(v+n<0){toast('Меньше нуля нельзя');return}
    send({t:'pt',p:p,n:n});toast(p+' '+(n>0?'+':'−')+Math.abs(n));return;
  }
  t=e.target.closest('button[data-edit]');
  if(t){editP=editP===t.dataset.edit?null:t.dataset.edit;render();return}
  t=e.target.closest('button[data-open]');
  if(t){var k=t.dataset.open;openR[k]=!openR[k];render();return}
});
document.addEventListener('change',function(e){
  var s=e.target.dataset&&e.target.dataset.s;if(!s)return;
  var c=S.cur,a=c.a,b=c.b,v=e.target.value;
  if(s==='a'){a=v;if(v===b)b=c.a}else{b=v;if(v===a)a=c.b}
  send({t:'teams',a:a,b:b});
});
/* ---- таймер игры ---- */
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){
  try{if(ac)[0,.25,.5].forEach(function(d){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.15)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200,100,400])}catch(e){}
}
function tick(){
  if(!S)return;
  var t=S.cur.tm,el=elapsed(t,Date.now()),rem=Math.max(0,GAME_MS-el),sec=Math.ceil(rem/1000);
  $('tclock').textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);
  $('tclock').className='tcl'+(rem===0&&el>0?' over':(t.run&&rem<=60000?' low':(t.run?' run':'')));
  $('tgo').textContent=t.run?'Пауза':(el>0?'Продолжить':'Старт');
  $('tlab').textContent=rem===0&&el>0?'время вышло':(t.run?'идёт игра':(el>0?'на паузе':'таймер игры'));
  if(t.run&&rem===0&&beeped!==S.games.length){
    beeped=S.games.length;
    if(el-GAME_MS<5000){beep();toast('Время вышло. Завершите игру.')}
  }
}
setInterval(tick,250);
$('tgo').onclick=function(){unlock();send({t:S.cur.tm.run?'tpause':'tstart'})};
$('trst').onclick=function(){ask('Сбросить таймер игры на '+(GAME_MS/60000)+':00?',function(ok){if(ok)send({t:'treset'})})};

/* ---- завершение игры: сначала окно подтверждения ---- */
var dlgS=null;
function resultNote(d){
  var dr=d.sa===d.sb,g={a:d.a,b:d.b,sa:d.sa,sb:d.sb,d:today(),dr:dr},np=nextPair(S.games.concat([g]),g);
  return {np:np,text:(dr?'Ничья: по очку каждой команде.':'Победа: '+S.names[d.sa>d.sb?d.a:d.b]+'.')+(np.benched?' '+S.names[np.benched]+' сыграла две игры подряд и уступает место.':'')+' Следующая игра: '+S.names[np.a]+' — '+S.names[np.b]+'.'};
}
function fillDlg(warn){
  var d=dlgS;
  $('dres').innerHTML='<div class="ds"><span>'+dot(d.a)+esc(S.names[d.a])+'</span><b>'+d.sa+'</b></div><div class="vs">:</div><div class="ds"><span>'+dot(d.b)+esc(S.names[d.b])+'</span><b>'+d.sb+'</b></div>';
  $('dnote').className='dnote'+(warn?' warn':'');
  $('dnote').textContent=warn||resultNote(d).text;
}
function closeDlg(){$('dlg').hidden=true;dlgS=null}
$('finish').onclick=function(){
  if(!S.roster){toast('Сначала загрузите составы');return}
  var c=S.cur;
  dlgS={a:c.a,b:c.b,sa:teamScore(S,c.a),sb:teamScore(S,c.b)};
  fillDlg('');$('dlg').hidden=false;$('dno').focus();
};
$('dno').onclick=closeDlg;
$('dback').onclick=closeDlg;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dlgS)closeDlg()});
$('dok').onclick=function(){
  if(!dlgS)return;
  var c=S.cur,sa=teamScore(S,c.a),sb=teamScore(S,c.b);
  /* пока окно было открыто, счёт мог измениться на другом телефоне */
  if(c.a!==dlgS.a||c.b!==dlgS.b||sa!==dlgS.sa||sb!==dlgS.sb){
    dlgS={a:c.a,b:c.b,sa:sa,sb:sb};fillDlg('Счёт изменился. Проверьте и подтвердите ещё раз.');return;
  }
  var r=resultNote(dlgS),dr=sa===sb;
  closeDlg();
  toast(r.text.replace(/^Победа: /,'Победили: '));
  var ev={t:'finish',d:today(),v:2};if(dr)ev.dr=true;
  send(ev);editP=null;
};
$('undo').onclick=function(){
  pr=false;$('msg').textContent='';
  send({t:'undo'});toast('Последнее действие отменено');
};
$('reset').onclick=function(){
  ask('Удалить все игры, победы и составы? Это увидят все устройства.',function(ok){
    if(!ok)return;
    if(!SYNC){remote=[];try{localStorage.removeItem(LKEY)}catch(e){}render();return}
    pending=[];fetch(EURL,{method:'DELETE'}).then(refresh).catch(function(){setSt(false)});
  });
};
$('rload').onclick=function(){
  var r=parse($('rt').value);
  if(!r){$('rmsg').textContent='Не удалось разобрать: нужны три команды с заголовками ⚪ ⚫ 🔴.';return}
  send({t:'roster',r:r});$('rmsg').textContent='Составы загружены.';$('rt').value='';
};

$('date').textContent=(function(){var s=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)})();
if(SYNC){
  setSt(true);
  refresh().catch(function(){setSt(false)});
  setInterval(function(){refresh().catch(function(){setSt(false)});flush()},3000);
}else{
  try{remote=JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){remote=[]}
  setSt(true);
}
render();
</script>
