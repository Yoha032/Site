<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АндрейСпросил</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="image" href="Bg/frame-halloween.webp">
<style>
:root{--r:20px}
html,body{margin:0;height:100%;overflow:hidden;background:#0A0A0A;font-family:Manrope,system-ui,sans-serif}

/* Сцена: сайт лежит ПОД фото, а у фото розовый экран вырезан насквозь.
   Поэтому пальцы, рамка телефона и когти остаются поверх сайта. */
#stage{position:fixed;left:0;right:0;bottom:0;top:0;overflow:hidden;opacity:0;transition:opacity .22s ease}
#win{position:absolute;left:0;top:0;width:390px;height:800px;transform-origin:0 0;overflow:hidden;background:#0A0A0A;z-index:1}
#win iframe{display:block;width:100%;height:100%;border:0;background:#0A0A0A}
#frame{position:absolute;left:0;top:0;max-width:none;z-index:2;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* Переключатели: компактная группа справа сверху, не растягивается */
.ctl{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center}
.seg{position:relative;display:flex;padding:3px;border:2px solid #B6FF1A;border-radius:var(--r);
  background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:48px;border-radius:var(--r);background:#B6FF1A;
  transform:translateX(calc(var(--k,0)*48px));transition:transform .3s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:48px;height:34px;padding:0;
  border:0;border-radius:var(--r);background:none;color:#F5F5F5;font-size:18px;line-height:1;cursor:pointer}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#stage,.seg i{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="win"><iframe src="index.html?app=1" title="Сайт АндрейСпросил" allow="autoplay"></iframe></div>
  <img id="frame" alt="" draggable="false">
</div>

<nav class="ctl" aria-label="Настройки вида">
  <div class="seg" id="vt" role="group" aria-label="Вид сайта" style="--k:1">
    <i></i>
    <button type="button" data-m="m" aria-pressed="false" aria-label="Телефон" title="Телефон">📱</button>
    <button type="button" data-m="d" aria-pressed="true" aria-label="Компьютер" title="Компьютер">💻</button>
  </div>
  <div class="seg" id="bgsw" role="group" aria-label="Фон" style="--k:1">
    <i></i>
    <button type="button" data-k="urban" aria-pressed="false" aria-label="Урбан" title="Урбан">🏙️</button>
    <button type="button" data-k="halloween" aria-pressed="true" aria-label="Хэллоуин" title="Хэллоуин">🎃</button>
    <button type="button" data-k="hohoho" aria-pressed="false" aria-label="Хо-хо-хо" title="Хо-хо-хо">☃️</button>
    <button type="button" data-k="redhand" aria-pressed="false" aria-label="Красная рука" title="Красная рука">💩</button>
  </div>
</nav>

<script>
(function(){
  /* Координаты розового экрана на каждом фото (доли от размера картинки) */
  var F={
    urban:    {src:"Bg/frame-urban.webp",    alt:"Bg/IMG_7048.jpeg", w:1280,h:720,x0:.4125, y0:.07083,x1:.59609,y1:.73333},
    halloween:{src:"Bg/frame-halloween.webp",alt:"Bg/IMG_7054.jpeg",w:1360,h:768,x0:.41544,y0:.08854,x1:.59265,y1:.72396},
    hohoho:   {src:"Bg/frame-hohoho.webp",   alt:"Bg/Hohoho%20.JPG", w:1360,h:768,x0:.43382,y0:.20443,x1:.59338,y1:.80208},
    redhand:  {src:"Bg/frame-redhand.webp",  alt:"Bg/RedHand.JPG",   w:1360,h:768,x0:.43824,y0:.16797,x1:.58382,y1:.70833}
  };
  var ORDER=["urban","halloween","hohoho","redhand"],SW=390,SH=800,FILL=.8;
  var ctl=document.querySelector(".ctl"),stage=document.getElementById("stage"),win=document.getElementById("win"),img=document.getElementById("frame");
  var vt=document.getElementById("vt"),bgsw=document.getElementById("bgsw");
  var cur=null,shown=null,timer=0;
  try{cur=localStorage.getItem("as:bg")}catch(e){}
  if(!F[cur])cur="halloween";   /* первый заход — Хэллоуин, дальше запоминаем выбор */

  function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}

  /* Подгоняем фото и окно сайта под экран:
     фото закрывает весь экран, а розовое окно крупнее, чтобы сайт читался. */
  function calc(H){
    var f=F[cur],W=innerWidth,pad=10;
    var avail=Math.max(120,H-2*pad);
    var hw=(f.x1-f.x0)*f.w,hh=(f.y1-f.y0)*f.h;
    var cover=Math.max(W/f.w,H/f.h);
    var want=Math.min(Math.min(avail*.94,H*.84)/hh,W*.9/hw);
    var s=Math.max(cover,Math.min(want,SW/hw));
    var iw=f.w*s,ih=f.h*s;
    var ox=clamp(W/2-(f.x0+f.x1)/2*iw,W-iw,0);
    var oy=clamp(H/2-(f.y0+f.y1)/2*ih,H-ih,0);
    return {iw:iw,ih:ih,ox:ox,oy:oy,
      L:ox+f.x0*iw,T:oy+f.y0*ih,R:ox+f.x1*iw,B:oy+f.y1*ih};
  }

  /* Если окно телефона заходит под переключатели, сцена целиком начинается ниже их полосы */
  function layout(){
    var c=ctl.getBoundingClientRect(),r=calc(innerHeight),off=0;
    var hit=r.R>c.left-6&&r.L<c.right+6&&r.T<c.bottom+28;
    if(hit){off=Math.ceil(c.bottom)+6;r=calc(innerHeight-off)}
    stage.style.top=off+"px";
    img.style.width=r.iw+"px";img.style.height=r.ih+"px";
    img.style.left=r.ox+"px";img.style.top=r.oy+"px";
    win.style.transform="translate("+r.L+"px,"+r.T+"px) scale("+((r.R-r.L)/SW)+","+((r.B-r.T)/SH)+")";
  }

  function reveal(){shown=cur;layout();stage.style.opacity=1}

  function show(){
    if(shown===cur){reveal();return}
    var f=F[cur],tried=0;
    win.style.zIndex=1;                       /* обычный режим: сайт под фото */
    win.style.borderRadius="";
    img.onload=reveal;
    img.onerror=function(){
      if(!tried){                             /* вырезанный кадр не нашёлся: берём исходное фото, сайт кладём поверх */
        tried=1;win.style.zIndex=3;win.style.borderRadius="44px";img.src=f.alt;
      }else{                                  /* нет и фото: показываем хотя бы сайт на тёмном фоне */
        img.style.display="none";win.style.zIndex=3;reveal();
      }
    };
    img.style.display="";
    img.src=f.src;
    if(img.complete&&img.naturalWidth)reveal();
    setTimeout(function(){if(stage.style.opacity!=="1")reveal()},2500);   /* страховка: никогда не оставляем чёрный экран */
  }

  function mark(group,idx){
    group.style.setProperty("--k",idx);
    group.querySelectorAll("button").forEach(function(b,i){b.setAttribute("aria-pressed",String(i===idx))});
  }

  function setBg(key,first){
    if(!F[key])return;
    cur=key;
    try{localStorage.setItem("as:bg",key)}catch(e){}
    mark(bgsw,ORDER.indexOf(key));
    if(first){show();return}
    stage.style.opacity=0;
    clearTimeout(timer);
    timer=setTimeout(show,220);
  }

  bgsw.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b||b.dataset.k===cur)return;
    setBg(b.dataset.k,false);
  });

  vt.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b||b.dataset.m==="d")return;
    try{localStorage.setItem("as:view","m")}catch(err){}
    location.href="index.html";
  });

  try{localStorage.setItem("as:view","d")}catch(e){}
  mark(vt,1);
  setBg(cur,true);
  addEventListener("resize",layout);
  addEventListener("orientationchange",function(){setTimeout(layout,200)});

  /* Подгружаем остальные фоны, чтобы переключение было мгновенным */
  addEventListener("load",function(){ORDER.forEach(function(k){if(k!==cur)(new Image()).src=F[k].src})});
})();
</script>
</body>
</html>
