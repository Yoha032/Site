name: Обновить каталог выпусков
on:
  push:
    paths: ["Podcasts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen
      - run: python make_catalog.py Podcasts Podcasts/
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Обновлён каталог выпусков" && git push)
